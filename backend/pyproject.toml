[project]
name = "integralis"
version = "1.0.0"
description = "A symbolic integration engine with verified step-by-step working"
requires-python = ">=3.10"
dependencies = ["sympy>=1.13,<1.15", "mpmath>=1.3", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["integralis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
